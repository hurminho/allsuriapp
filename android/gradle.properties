org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Reuse build outputs across builds instead of re-running tasks from scratch.
org.gradle.caching=true
# 8 logical cores; capped at 4 workers so peak memory stays well under 16GB RAM.
org.gradle.parallel=true
org.gradle.workers.max=4
# Bound the Kotlin compile daemon, which otherwise sizes its heap independently.
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m

android.useAndroidX=true
android.enableJetifier=true
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home

# ✅ 16KB 페이지 크기 지원 설정 (Google Play 요구사항)
android.experimental.enable16KbPageSize=true

