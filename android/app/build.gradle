plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"  // Add the Google services Gradle plugin
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Load keystore properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def requiredSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def hasPropertySigning = requiredSigningKeys.every {
    keystoreProperties[it]?.toString()?.trim()
}
def hasEnvironmentSigning = [
    'KEYSTORE_FILE',
    'KEYSTORE_PASSWORD',
    'KEY_ALIAS',
    'KEY_PASSWORD'
].every { System.getenv(it)?.trim() }
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
def configuredStoreFile = hasPropertySigning
        ? file(keystoreProperties['storeFile'])
        : (hasEnvironmentSigning ? file(System.getenv('KEYSTORE_FILE')) : null)

if (releaseTaskRequested && !hasPropertySigning && !hasEnvironmentSigning) {
    throw new GradleException(
        'Release signing is not configured. Add android/key.properties or the CI signing environment variables.'
    )
}
if (releaseTaskRequested && (configuredStoreFile == null || !configuredStoreFile.exists())) {
    throw new GradleException(
        'The configured release keystore file does not exist. Check storeFile or KEYSTORE_FILE.'
    )
}

android {
    namespace "com.ononcompany.allsuri"
    compileSdk 36 // ✅ 36으로 명시적 설정
    ndkVersion "27.0.12077973" // ✅ 16KB를 완전 지원하는 최신 NDK로 명시적 설정

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 // ✅ 최신 코틀린 대응을 위해 Java 17 권장
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.ononcompany.allsuri"
        minSdkVersion flutter.minSdkVersion  // ✅ 명시적으로 23 설정
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        manifestPlaceholders = [
            'kakaoCustomSchemePrefix': 'kakao'
        ]
        
        // ✅ 16KB 페이지 크기 강제 정렬 설정 (핵심!)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_MAX_PAGE_SIZE=16384"
                cppFlags "-Wl,-z,max-page-size=16384"
            }
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    signingConfigs {
        release {
            if (hasPropertySigning) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile configuredStoreFile
                storePassword keystoreProperties['storePassword']
            } else if (hasEnvironmentSigning) {
                storeFile configuredStoreFile
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // 릴리즈에서 debug 키로 조용히 폴백하지 않는다.
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Keep default debug config
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation platform('com.google.firebase:firebase-bom:32.3.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
}
