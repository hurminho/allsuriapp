<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>올수리 - 오더 확인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #333;
        }
        
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        
        .btn {
            display: inline-block;
            padding: 16px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 20px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="icon">🚀</div>
        <h1>올수리 앱으로 이동 중...</h1>
        <p>앱이 자동으로 열립니다.<br>앱이 열리지 않으면 아래 버튼을 눌러주세요.</p>
        <a href="#" class="btn" id="openAppBtn">
            앱에서 열기
        </a>
        <p style="margin-top: 20px; font-size: 14px;">
            <a href="https://play.google.com/store/apps/details?id=com.ononcompany.allsuri" 
               style="color: #667eea; text-decoration: none;">
                앱이 설치되어 있지 않나요? → 다운로드
            </a>
        </p>
    </div>
    
    <script>
        // URL에서 orderId 추출
        const pathParts = window.location.pathname.split('/');
        const orderId = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];
        
        console.log('Order ID:', orderId);
        
        if (orderId && orderId.length > 10) {
            // Android Intent URL 생성
            const intentUrl = `intent://order/${orderId}#Intent;scheme=allsuri;package=com.ononcompany.allsuri;end`;
            
            // 버튼 URL 업데이트
            document.getElementById('openAppBtn').href = intentUrl;
            
            // iOS는 커스텀 스킴 사용
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            if (isIOS) {
                const iosUrl = `allsuri://order/${orderId}`;
                document.getElementById('openAppBtn').href = iosUrl;
                
                // 즉시 시도
                window.location.href = iosUrl;
                
                // 2초 후에도 앱이 안 열리면 Play Store로
                setTimeout(() => {
                    window.location.href = 'https://apps.apple.com/kr/app/id6760454320';
                }, 2000);
            } else {
                // Android는 자동 리디렉트
                window.location.href = intentUrl;
            }
        } else {
            document.querySelector('.container').innerHTML = `
                <div class="icon">⚠️</div>
                <h1>잘못된 링크입니다</h1>
                <p>올바른 오더 링크가 아닙니다.</p>
                <a href="https://play.google.com/store/apps/details?id=com.ononcompany.allsuri" class="btn">
                    앱 다운로드
                </a>
            `;
        }
    </script>
</body>
</html>
